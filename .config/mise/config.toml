[shell_alias]
ls = "lsd"
la = "lsd -A1 --blocks permission,date,git,size,name"
cat = "bat"
cd = "z"
top = "btm"
du = "dust"

[tools]
age = "latest"
atuin = "latest"
"aqua:auth0/auth0-cli" = "latest"
aws = { version = "latest", symlink_bins = "true" }
bat = "latest"
bottom = "latest"
claude = "latest"
"aqua:github/copilot-cli" = "latest"
"aqua:YS-L/csvlens" = "latest"
delta = "latest"
# yt-dlp needs a JavaScript runtime for YouTube.
deno = "latest"
dust = "latest"
fd = "latest"
fnox = "latest"
fzf = "latest"
gcloud = "latest"
gh = "latest"
gitleaks = "latest"
hunk = "latest"
"aqua:jj" = "latest"
jq = "latest"
kubectl = "latest"
lazygit = "latest"
"cargo:lazyjj" = "latest"
lsd = "latest"
neovim = "latest"
node = "22"
pi = "latest"
# gcloud needs Python 3.14 to install. "latest" stays the default python3.
python = ["latest", "3.14"]
restic = "latest"
ripgrep = "latest"
rust = "latest"
saml2aws = "latest"
shellcheck = "latest"
sops = "latest"
starship = "latest"
yamlfmt = "latest"
yarn = "latest"
yazi = "latest"
yq = "latest"
yt-dlp = "latest"
zig = "master"
zoxide = "latest"

[settings]
# mise.lock holds the exact version and checksum of each tool, so a new machine
# gets the same versions. `mise upgrade` writes the new versions into it.
lockfile = true
# Only this platform is in the lockfile. Without this line mise locks 7 platforms.
lockfile_platforms = ["macos-arm64"]
