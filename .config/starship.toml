"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

# Two-line layout: path + vcs info on line 1, prompt character on line 2.
# $fill pushes cmd_duration to the right side of the terminal.
format = """
$directory$vcs$fill$python$nodejs$rust$zig$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
format = "[$duration](bold yellow) "

[directory]
truncation_length = 4
truncate_to_repo = true

# jj goes first: a colocated jj repo also has a .git dir, and git would show
# the wrong state there.
[vcs]
order = ["jj", "git"]
